version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: renewable-dashboard-sql
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/RenewableDashboard.Api/Dockerfile
    container_name: renewable-dashboard-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=RenewableDashboard;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - EIA_API_KEY=${EIA_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  blazor:
    build:
      context: .
      dockerfile: src/RenewableDashboard.Blazor/Dockerfile
    container_name: renewable-dashboard-blazor
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=RenewableDashboard;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - EIA_API_KEY=${EIA_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqldata:
